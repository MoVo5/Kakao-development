<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 행복을 찾아서! 문화시설지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            min-width: 320px;
            padding: 20px;
            overflow-y: auto;
            background: #fffaf4;
        }

        h1 {
            margin-top: 0;
            font-size: 23px;
            line-height: 1.5;
            color: #805b45;
        }

        .description {
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 10px;
            background: #eadfd4;
            color: #59483b;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button.active {
            background: #9b7658;
            color: white;
        }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        #searchInput {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-button,
        .location-button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #9b7658;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .location-button {
            width: 100%;
            margin-bottom: 15px;
            background: #d7a982;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #805b45;
            outline-offset: 2px;
        }

        #status {
            margin: 12px 0;
            font-size: 13px;
            color: #725b49;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .place-item {
            padding: 14px 10px;
            margin-bottom: 8px;
            border: 1px solid #eee2d6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f6eee6;
        }

        .place-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .place-item small {
            display: block;
            color: #777;
            line-height: 1.5;
        }

        .place-link {
            display: inline-block;
            margin-top: 7px;
            color: #527d36;
            font-size: 12px;
        }

        #pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin: 18px 0;
        }

        .page-button {
            min-width: 30px;
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .page-button.active {
            background: #9b7658;
            color: white;
        }

        .page-button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eee;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 14px;
            }

            #map {
                flex: 1;
                min-height: 220px;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <aside class="sidebar">
            <h1>오늘의 행복을 찾아서!<br>문화시설지도</h1>

            <p class="description">
                내 주변 문화시설을 찾아<br>
                오늘의 행복을 발견해 보세요!
            </p>

            <div class="tabs">
                <button
                    class="tab-button active"
                    id="musicalTab"
                    type="button">
                    뮤지컬 보러가기🎫
                </button>

                <button
                    class="tab-button"
                    id="movieTab"
                    type="button">
                    영화 보러가🍿
                </button>
            </div>

            <div class="search-box">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="문화시설 이름 검색"
                    aria-label="문화시설 이름 검색">

                <button
                    class="search-button"
                    id="searchButton"
                    type="button">
                    검색
                </button>
            </div>

            <button
                class="location-button"
                id="locationButton"
                type="button">
                📍 내 현재 위치 확인
            </button>

            <div id="status" role="status" aria-live="polite">
                카카오 지도를 불러오는 중입니다.
            </div>

            <ul id="resultList"></ul>
            <div id="pagination" aria-label="검색 결과 페이지"></div>
        </aside>

        <div id="map" aria-label="주변 문화시설 지도"></div>
    </div>

    <!-- 카카오 지도 SDK -->
    <script
        id="kakaoSdk"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5e49c63bc49c9eb43bf2f0e8e798f477&libraries=services,clusterer&autoload=false">
    </script>

    <script>
        // 지도와 검색에 필요한 변수
        let map = null;
        let placesService = null;
        let clusterer = null;
        let currentLocationMarker = null;
        let currentPosition = null;
        let currentTab = 'musical';
        let currentMarkers = [];
        let currentPlaces = [];
        let infoWindow = null;
        let searchRequestNumber = 0;
        let currentPage = 1;
        let allSearchResults = [];

        // 기본 지도 중심: 서울 시청
        const defaultLatitude = 37.5665;
        const defaultLongitude = 126.9780;

        // 연두색 장소 마커
        const markerImageUrl =
            'data:image/svg+xml;charset=UTF-8,' +
            encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" ' +
                'width="36" height="46" viewBox="0 0 36 46">' +
                '<path d="M18 44 C14 35 3 24 3 16 A15 15 0 1 1 33 16 C33 24 22 35 18 44Z" ' +
                'fill="#A8D96C" stroke="#668F35" stroke-width="2"/>' +
                '<circle cx="18" cy="16" r="6" fill="#FFFFFF"/>' +
                '</svg>'
            );

        const markerImage = null;

        function getElement(id) {
            return document.getElementById(id);
        }

        function setStatus(message) {
            getElement('status').textContent = message;
        }

        // 페이지가 준비되면 버튼에 기능 연결
        document.addEventListener('DOMContentLoaded', function () {
            getElement('musicalTab').addEventListener('click', function () {
                changeTab('musical');
            });

            getElement('movieTab').addEventListener('click', function () {
                changeTab('movie');
            });

            getElement('searchButton').addEventListener('click', searchKeyword);

            getElement('locationButton').addEventListener(
                'click',
                getCurrentLocation
            );

            getElement('searchInput').addEventListener('keydown', function (event) {
                if (event.key === 'Enter') {
                    searchKeyword();
                }
            });
        });

        const sdkScript = getElement('kakaoSdk');

        sdkScript.addEventListener('error', function () {
            setStatus(
                '카카오 지도 SDK를 불러오지 못했습니다. ' +
                'JavaScript 키와 사이트 도메인을 확인해 주세요.'
            );
        });

        // 지도 초기화
        function initializeMap() {
            const defaultPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            map = new kakao.maps.Map(getElement('map'), {
                center: defaultPosition,
                level: 5
            });

            placesService = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            // 마커 군집화 기능
            clusterer = new kakao.maps.MarkerClusterer({
                map: map,
                averageCenter: true,
                minLevel: 7,
                disableClickZoom: false
            });

            getCurrentLocation();
        }

        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    '카카오 지도 SDK가 준비되지 않았습니다. ' +
                    'JavaScript 키와 인터넷 연결을 확인해 주세요.'
                );
                return;
            }

            kakao.maps.load(function () {
                try {
                    initializeMap();
                } catch (error) {
                    console.error('지도 초기화 오류:', error);
                    setStatus('지도 초기화에 실패했습니다. Console을 확인해 주세요.');
                }
            });
        }

        if (window.kakao && window.kakao.maps) {
            loadKakaoMap();
        } else {
            sdkScript.addEventListener('load', loadKakaoMap, {
                once: true
            });
        }

        // 실제 현재 위치 가져오기
        function getCurrentLocation() {
            if (!map) {
                setStatus('지도를 준비하고 있습니다. 잠시 기다려 주세요.');
                return;
            }

            if (!navigator.geolocation) {
                setStatus('이 브라우저에서는 현재 위치 확인을 지원하지 않습니다.');
                return;
            }

            setStatus('현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.');

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                    }

                    // 현재 위치 마커는 연두색과 구별하기 위해 기본 마커 사용
                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: '내 현재 위치'
                    });

                    setStatus('현재 위치를 확인했습니다. 주변 장소를 검색합니다.');
                    searchNearby();
                },
                function (error) {
                    currentPosition = null;

                    const defaultPosition = new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    );

                    map.setCenter(defaultPosition);
                    map.setLevel(5);

                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                        currentLocationMarker = null;
                    }

                    let message = '현재 위치를 확인할 수 없습니다.';

                    if (error.code === 1) {
                        message += ' 브라우저의 위치 권한을 허용해 주세요.';
                    } else if (error.code === 2) {
                        message += ' 위치 정보를 사용할 수 없습니다.';
                    } else if (error.code === 3) {
                        message += ' 위치 확인 시간이 초과되었습니다.';
                    }

                    setStatus(message + ' 서울 시청 주변에서 검색합니다.');
                    searchNearby();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 60000
                }
            );
        }

        // 탭 변경
        function changeTab(tab) {
            currentTab = tab;

            getElement('musicalTab').classList.toggle(
                'active',
                tab === 'musical'
            );

            getElement('movieTab').classList.toggle(
                'active',
                tab === 'movie'
            );

            getElement('searchInput').value = '';
            searchNearby();
        }

        // 기존 결과와 마커 제거
        function clearResults() {
            searchRequestNumber++;

            if (clusterer) {
                clusterer.clear();
            }

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            currentPlaces = [];
            allSearchResults = [];
            currentPage = 1;

            if (infoWindow) {
                infoWindow.close();
            }

            getElement('resultList').innerHTML = '';
            getElement('pagination').innerHTML = '';
        }

        // 탭별 검색어
        function getSearchKeywords() {
            if (currentTab === 'musical') {
                return ['공연장', '연극극장'];
            }

            return ['CGV', '메가박스', '롯데시네마'];
        }

        // 검색 결과가 현재 탭에 맞는지 확인
        function isCorrectPlace(place) {
            const name = (place.place_name || '').toLowerCase();
            const category = (place.category_name || '').toLowerCase();

            if (currentTab === 'musical') {
                // 공연장 또는 연극극장 관련 카테고리만 표시
                const correctCategory =
                    category.includes('공연장') ||
                    category.includes('연극극장');

                return correctCategory;
            }

            // 영화 탭에서는 지정된 3개 영화관 브랜드만 표시
            return (
                name.includes('cgv') ||
                name.includes('씨지브이') ||
                name.includes('메가박스') ||
                name.includes('롯데시네마')
            );
        }

        // 주변 문화시설 검색
        function searchNearby() {
            if (!map || !placesService) {
                return;
            }

            clearResults();

            const requestNumber = searchRequestNumber;
            const keywords = getSearchKeywords();
            const center = currentPosition || map.getCenter();

            setStatus('선택한 탭에 맞는 장소를 검색하고 있습니다.');

            // 여러 검색어의 결과를 모아 중복 제거
            let completedSearches = 0;
            let combinedResults = [];

            keywords.forEach(function (keyword) {
                placesService.keywordSearch(
                    keyword,
                    function (data, status) {
                        if (requestNumber !== searchRequestNumber) {
                            return;
                        }

                        if (status === kakao.maps.services.Status.OK) {
                            combinedResults = combinedResults.concat(data);
                        }

                        completedSearches++;

                        if (completedSearches === keywords.length) {
                            finishNearbySearch(
                                combinedResults,
                                requestNumber
                            );
                        }
                    },
                    {
                        location: center,
                        radius: 10000,
                        sort: kakao.maps.services.SortBy.DISTANCE
                    }
                );
            });
        }

        // 검색 결과 합치기 및 필터링
        function finishNearbySearch(data, requestNumber) {
            if (requestNumber !== searchRequestNumber) {
                return;
            }

            const uniquePlaces = [];
            const seenIds = new Set();

            data.forEach(function (place) {
                if (!seenIds.has(place.id) && isCorrectPlace(place)) {
                    seenIds.add(place.id);
                    uniquePlaces.push(place);
                }
            });

            // 현재 위치와 가까운 순서로 정렬
            const center = currentPosition || map.getCenter();

            uniquePlaces.sort(function (a, b) {
                const distanceA = getDistance(
                    Number(center.getLat()),
                    Number(center.getLng()),
                    Number(a.y),
                    Number(a.x)
                );

                const distanceB = getDistance(
                    Number(center.getLat()),
                    Number(center.getLng()),
                    Number(b.y),
                    Number(b.x)
                );

                return distanceA - distanceB;
            });

            allSearchResults = uniquePlaces;
            currentPage = 1;

            if (uniquePlaces.length === 0) {
                clearResults();
                setStatus(
                    '조건에 맞는 장소가 없습니다. 다른 검색어를 입력해 보세요.'
                );
                return;
            }

            renderCurrentPage();

            setStatus(
                '조건에 맞는 장소 ' + uniquePlaces.length + '곳을 찾았습니다.'
            );
        }

        // 두 위치 사이의 거리 계산(미터)
        function getDistance(lat1, lon1, lat2, lon2) {
            const earthRadius = 6371000;
            const toRadians = function (degree) {
                return degree * Math.PI / 180;
            };

            const dLat = toRadians(lat2 - lat1);
            const dLon = toRadians(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRadians(lat1)) *
                Math.cos(toRadians(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            return earthRadius * 2 * Math.atan2(
                Math.sqrt(a),
                Math.sqrt(1 - a)
            );
        }

        // 장소 이름 검색
        function searchKeyword() {
            if (!map || !placesService) {
                setStatus('지도를 준비하고 있습니다. 잠시 기다려 주세요.');
                return;
            }

            const keyword = getElement('searchInput').value.trim();

            if (!keyword) {
                searchNearby();
                return;
            }

            clearResults();

            const requestNumber = searchRequestNumber;

            setStatus('입력한 장소를 검색하고 있습니다.');

            placesService.keywordSearch(
                keyword,
                function (data, status) {
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    if (status !== kakao.maps.services.Status.OK) {
                        setStatus('검색 결과가 없습니다. 다른 검색어를 입력해 주세요.');
                        return;
                    }

                    const filteredResults = data.filter(function (place) {
                        return isCorrectPlace(place);
                    });

                    if (filteredResults.length === 0) {
                        setStatus(
                            '현재 탭의 조건에 맞는 검색 결과가 없습니다.'
                        );
                        return;
                    }

                    allSearchResults = filteredResults;
                    currentPage = 1;
                    renderCurrentPage();

                    setStatus(
                        '검색 결과 ' + filteredResults.length + '곳을 찾았습니다.'
                    );
                },
                {
                    location: currentPosition || map.getCenter(),
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 한 페이지에 최대 15개 표시
        function renderCurrentPage() {
            const pageSize = 15;
            const startIndex = (currentPage - 1) * pageSize;

            currentPlaces = allSearchResults.slice(
                startIndex,
                startIndex + pageSize
            );

            renderPlaces(currentPlaces);
            renderPagination();
        }

        // 장소 목록과 지도 마커 표시
        function renderPlaces(places) {
            clusterer.clear();

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            getElement('resultList').innerHTML = '';

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 연두색 마커 생성
                const marker = new kakao.maps.Marker({
                    position: position,
                    title: place.place_name,
                    image: new kakao.maps.MarkerImage(
                        markerImageUrl,
                        new kakao.maps.Size(36, 46),
                        {
                            offset: new kakao.maps.Point(18, 46)
                        }
                    )
                });

                currentMarkers.push(marker);

                kakao.maps.event.addListener(
                    marker,
                    'click',
                    function () {
                        showPlaceInfo(place, position);
                    }
                );

                const listItem = document.createElement('li');
                listItem.className = 'place-item';

                const title = document.createElement('strong');
                title.textContent =
                    ((currentPage - 1) * 15 + index + 1) +
                    '. ' + place.place_name;

                const address = document.createElement('small');
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    '주소 정보 없음';

                const category = document.createElement('small');
                category.textContent =
                    place.category_name || '문화시설';

                listItem.appendChild(title);
                listItem.appendChild(address);
                listItem.appendChild(category);

                listItem.addEventListener('click', function (event) {
                    if (event.target.closest('a')) {
                        return;
                    }

                    map.panTo(position);
                    showPlaceInfo(place, position);
                });

                if (place.place_url) {
                    const link = document.createElement('a');

                    link.className = 'place-link';
                    link.href = place.place_url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = '카카오맵에서 자세히 보기';

                    listItem.appendChild(document.createElement('br'));
                    listItem.appendChild(link);
                }

                getElement('resultList').appendChild(listItem);
            });

            // 현재 페이지의 마커 군집화
            if (currentMarkers.length > 0) {
                clusterer.addMarkers(currentMarkers);
            }
        }

        // 마커 클릭 시 장소 정보 표시
        function showPlaceInfo(place, position) {
            const address =
                place.road_address_name ||
                place.address_name ||
                '주소 정보 없음';

            // HTML에 들어가는 문자열 안전하게 처리
            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, function (char) {
                    const entities = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };

                    return entities[char];
                });
            }

            let content =
                '<div style="padding:12px;max-width:260px;' +
                'font-size:13px;line-height:1.7;">' +
                '<strong style="font-size:15px;">' +
                escapeHtml(place.place_name) +
                '</strong><br>' +
                escapeHtml(address) +
                '<br><br>' +
                escapeHtml(place.category_name || '문화시설');

            if (place.place_url) {
                content +=
                    '<br><br><a href="' +
                    escapeHtml(place.place_url) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    '장소 상세 정보 보기</a>';
            }

            content += '</div>';

            infoWindow.setContent(content);
            infoWindow.setPosition(position);
            infoWindow.open(map);
        }

        // 페이지 번호 표시
        function renderPagination() {
            const paginationElement = getElement('pagination');
            paginationElement.innerHTML = '';

            const pageSize = 15;
            const totalPages = Math.ceil(
                allSearchResults.length / pageSize
            );

            if (totalPages <= 1) {
                return;
            }

            addPageButton(
                '이전',
                function () {
                    if (currentPage > 1) {
                        currentPage--;
                        renderCurrentPage();
                    }
                },
                currentPage === 1
            );

            for (let page = 1; page <= totalPages; page++) {
                const pageNumber = page;

                addPageButton(
                    String(pageNumber),
                    function () {
                        currentPage = pageNumber;
                        renderCurrentPage();
                    },
                    false,
                    pageNumber === currentPage
                );
            }

            addPageButton(
                '다음',
                function () {
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderCurrentPage();
                    }
                },
                currentPage === totalPages
            );
        }

        // 페이지 버튼 생성
        function addPageButton(label, callback, disabled, active) {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'page-button';
            button.textContent = label;
            button.disabled = disabled;

            if (active) {
                button.classList.add('active');
            }

            button.addEventListener('click', callback);

            getElement('pagination').appendChild(button);
        }
    </script>
</body>
</html>
