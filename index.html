
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 행복을 찾아서: 문화시설 지도</title>

    <style>
        /* 전체 화면 설정 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        /* 화면을 왼쪽과 오른쪽으로 나누기 */
        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 검색 영역 */
        .sidebar {
            width: 380px;
            min-width: 320px;
            padding: 20px;
            overflow-y: auto;
            background: #fffaf4;
        }

        h1 {
            margin-top: 0;
            font-size: 23px;
            line-height: 1.5;
            color: #805b45;
        }

        .description {
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }

        /* 탭 버튼 */
        .tabs {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 10px;
            background: #eadfd4;
            color: #59483b;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button.active {
            background: #9b7658;
            color: white;
        }

        /* 검색창 */
        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        #searchInput {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-button,
        .location-button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #9b7658;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .location-button {
            width: 100%;
            margin-bottom: 15px;
            background: #d7a982;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #805b45;
            outline-offset: 2px;
        }

        /* 상태 안내 */
        #status {
            margin: 12px 0;
            font-size: 13px;
            color: #725b49;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        /* 검색 결과 목록 */
        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .place-item {
            padding: 14px 10px;
            margin-bottom: 8px;
            border: 1px solid #eee2d6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f6eee6;
        }

        .place-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .place-item small {
            display: block;
            color: #777;
            line-height: 1.5;
        }

        .place-link {
            display: inline-block;
            margin-top: 7px;
            color: #865d3e;
            font-size: 12px;
        }

        /* 페이지 번호 */
        #pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin: 18px 0;
        }

        .page-button {
            min-width: 30px;
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .page-button.active {
            background: #9b7658;
            color: white;
        }

        .page-button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eee;
        }

        /* 작은 화면에서는 위아래로 배치 */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 14px;
            }

            #map {
                flex: 1;
                min-height: 220px;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- 왼쪽 검색창과 결과 목록 -->
        <aside class="sidebar">
            <h1>오늘의 행복을 찾아서<br>문화시설 지도</h1>

            <p class="description">
                내 주변 문화시설을 찾아<br>
                오늘의 행복을 발견해 보세요!
            </p>

            <!-- 문화시설 검색 탭 -->
            <div class="tabs">
                <button
                    class="tab-button active"
                    id="musicalTab"
                    type="button">
                    뮤지컬 보러가기
                </button>

                <button
                    class="tab-button"
                    id="movieTab"
                    type="button">
                    영화 보러가기
                </button>
            </div>

            <!-- 장소 이름 검색 -->
            <div class="search-box">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="문화시설 이름 검색"
                    aria-label="문화시설 이름 검색">

                <button
                    class="search-button"
                    id="searchButton"
                    type="button">
                    검색
                </button>
            </div>

            <button
                class="location-button"
                id="locationButton"
                type="button">
                📍 내 현재 위치 확인
            </button>

            <div id="status" role="status" aria-live="polite">
                카카오 지도를 불러오는 중입니다.
            </div>

            <ul id="resultList"></ul>
            <div id="pagination" aria-label="검색 결과 페이지"></div>
        </aside>

        <!-- 오른쪽 지도 -->
        <div id="map" aria-label="주변 문화시설 지도"></div>
    </div>

    <!-- 카카오 지도 SDK -->
    <!-- YOUR_KAKAO_JAVASCRIPT_KEY를 본인의 JavaScript 키로 교체하세요. -->
    <script
        id="kakaoSdk"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5e49c63bc49c9eb43bf2f0e8e798f477&libraries=services,clusterer&autoload=false">
    </script>

    <script>
        // 지도와 검색에 필요한 변수
        let map = null;
        let placesService = null;
        let clusterer = null;
        let currentLocationMarker = null;
        let currentPosition = null;
        let currentTab = 'musical';
        let currentMarkers = [];
        let currentPlaces = [];
        let infoWindow = null;
        let searchRequestNumber = 0;

        // 기본 지도 중심 좌표
        const defaultLatitude = 37.5665;
        const defaultLongitude = 126.9780;

        // HTML 요소를 쉽게 찾는 함수
        function getElement(id) {
            return document.getElementById(id);
        }

        // 안내 문구를 변경하는 함수
        function setStatus(message) {
            getElement('status').textContent = message;
        }

        // 페이지가 준비되면 버튼에 기능 연결
        document.addEventListener('DOMContentLoaded', function () {
            getElement('musicalTab').addEventListener(
                'click',
                function () {
                    changeTab('musical');
                }
            );

            getElement('movieTab').addEventListener(
                'click',
                function () {
                    changeTab('movie');
                }
            );

            getElement('searchButton').addEventListener(
                'click',
                searchKeyword
            );

            getElement('locationButton').addEventListener(
                'click',
                getCurrentLocation
            );

            getElement('searchInput').addEventListener(
                'keydown',
                function (event) {
                    if (event.key === 'Enter') {
                        searchKeyword();
                    }
                }
            );
        });

        // 카카오 지도 SDK가 정상적으로 불러와졌는지 확인
        const sdkScript = getElement('kakaoSdk');

        sdkScript.addEventListener('error', function () {
            setStatus(
                '카카오 지도 SDK를 불러오지 못했습니다. ' +
                'JavaScript 키와 사이트 도메인을 확인해 주세요.'
            );
        });

        // 카카오 지도 SDK가 준비된 뒤 지도 생성
        // 중요: kakao.maps.LatLng도 이 함수 안에서만 사용합니다.
        function initializeMap() {
            // 기본 지도 중심 좌표 생성
            const defaultPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            // 지도 생성 및 확대 레벨 설정
            map = new kakao.maps.Map(
                getElement('map'),
                {
                    center: defaultPosition,
                    level: 5
                }
            );

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places(map);

            // 장소 상세 팝업 생성
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            // 마커 군집화 기능 생성
            clusterer = new kakao.maps.MarkerClusterer({
                map: map,
                averageCenter: true,
                minLevel: 7
            });

            // 지도가 준비된 뒤 현재 위치 확인
            getCurrentLocation();
        }

        // 카카오 SDK가 로드된 후 실행
        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    '카카오 지도 SDK가 준비되지 않았습니다. ' +
                    'JavaScript 키와 인터넷 연결을 확인해 주세요.'
                );
                return;
            }

            // autoload=false이므로 load 함수에서 지도 API 초기화
            kakao.maps.load(function () {
                try {
                    initializeMap();
                } catch (error) {
                    console.error('지도 초기화 오류:', error);
                    setStatus(
                        '지도 초기화에 실패했습니다. ' +
                        'F12의 Console에서 오류를 확인해 주세요.'
                    );
                }
            });
        }

        // SDK 스크립트가 이미 로드되었는지 확인
        if (window.kakao && window.kakao.maps) {
            loadKakaoMap();
        } else {
            sdkScript.addEventListener('load', loadKakaoMap, {
                once: true
            });
        }

        // 현재 위치 확인
        function getCurrentLocation() {
            if (!map) {
                setStatus('지도를 준비하고 있습니다. 잠시 기다려 주세요.');
                return;
            }

            if (!navigator.geolocation) {
                setStatus(
                    '이 브라우저에서는 현재 위치 확인을 지원하지 않습니다.'
                );
                searchNearby();
                return;
            }

            setStatus(
                '현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.'
            );

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 브라우저에서 받은 현재 위치 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 지도 중심을 현재 위치로 이동
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 기존 현재 위치 마커 제거
                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                    }

                    // 현재 위치 마커 생성
                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: '내 현재 위치'
                    });

                    setStatus(
                        '현재 위치를 확인했습니다. 주변 문화시설을 검색합니다.'
                    );

                    // 현재 위치 주변 검색
                    searchNearby();
                },
                function (error) {
                    // 위치 확인 실패 시 기본 위치 사용
                    currentPosition = null;

                    const defaultPosition = new kakao.maps.LatLng(
                        defaultLatitude,
                        defaultLongitude
                    );

                    map.setCenter(defaultPosition);
                    map.setLevel(5);

                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                        currentLocationMarker = null;
                    }

                    setStatus(
                        '현재 위치를 확인할 수 없어 서울 시청 주변에서 검색합니다. ' +
                        '위치 권한과 HTTPS 연결을 확인해 주세요.'
                    );

                    searchNearby();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 탭 변경
        function changeTab(tab) {
            currentTab = tab;

            getElement('musicalTab').classList.toggle(
                'active',
                tab === 'musical'
            );

            getElement('movieTab').classList.toggle(
                'active',
                tab === 'movie'
            );

            // 이전 검색 결과 초기화
            clearResults();

            // 탭 변경 시 카테고리 검색으로 전환
            getElement('searchInput').value = '';

            // 새 탭의 장소 검색
            searchNearby();
        }

        // 기존 검색 결과 제거
        function clearResults() {
            // 이전 검색 응답이 나중에 도착해도 무시하도록 번호 변경
            searchRequestNumber++;

            // 기존 군집 제거
            if (clusterer) {
                clusterer.clear();
            }

            // 기존 마커 제거
            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            currentPlaces = [];

            // 팝업 닫기
            if (infoWindow) {
                infoWindow.close();
            }

            // 목록과 페이지 번호 제거
            getElement('resultList').innerHTML = '';
            getElement('pagination').innerHTML = '';
        }

        // 주변 문화시설 검색
        function searchNearby() {
            if (!map || !placesService) {
                return;
            }

            clearResults();

            const requestNumber = searchRequestNumber;

            setStatus('주변 문화시설을 검색하고 있습니다.');

            // 현재 위치 또는 지도 중심을 기준으로 검색
            const options = {
                location: currentPosition || map.getCenter(),
                radius: 10000,
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            // CT1은 문화시설 전체 카테고리
            placesService.categorySearch(
                'CT1',
                function (data, status, pagination) {
                    // 이전 검색에서 늦게 도착한 결과 무시
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    handleSearchResults(data, status, pagination);
                },
                options
            );
        }

        // 장소 이름 검색
        function searchKeyword() {
            if (!map || !placesService) {
                setStatus('지도를 준비하고 있습니다. 잠시 기다려 주세요.');
                return;
            }

            const keyword = getElement('searchInput').value.trim();

            // 검색어가 없으면 주변 문화시설 검색
            if (!keyword) {
                searchNearby();
                return;
            }

            clearResults();

            const requestNumber = searchRequestNumber;

            setStatus('입력한 장소를 검색하고 있습니다.');

            placesService.keywordSearch(
                keyword,
                function (data, status, pagination) {
                    // 이전 검색에서 늦게 도착한 결과 무시
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    handleSearchResults(data, status, pagination);
                },
                {
                    location: currentPosition || map.getCenter(),
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 검색 결과 처리
        function handleSearchResults(data, status, pagination) {
            if (status === kakao.maps.services.Status.ZERO_RESULT) {
                clearResults();
                setStatus('검색 결과가 없습니다. 다른 검색어를 입력해 주세요.');
                return;
            }

            if (status !== kakao.maps.services.Status.OK) {
                setStatus(
                    '검색에 실패했습니다. 잠시 후 다시 시도해 주세요.'
                );
                return;
            }

            currentPlaces = data;

            // 장소 목록과 마커 표시
            renderPlaces(data);

            // 페이지 번호 표시
            renderPagination(pagination);

            setStatus(
                '현재 페이지 검색 결과: ' + data.length + '곳'
            );
        }

        // 장소 목록과 지도 마커 표시
        function renderPlaces(places) {
            // 이전 페이지의 마커와 군집 제거
            clusterer.clear();

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            getElement('resultList').innerHTML = '';

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 장소 마커 생성
                const marker = new kakao.maps.Marker({
                    position: position,
                    title: place.place_name
                });

                currentMarkers.push(marker);

                // 마커 클릭 시 상세 팝업 표시
                kakao.maps.event.addListener(
                    marker,
                    'click',
                    function () {
                        showPlaceInfo(place, position);
                    }
                );

                // 목록 항목 생성
                const listItem = document.createElement('li');
                listItem.className = 'place-item';

                const title = document.createElement('strong');
                title.textContent =
                    (index + 1) + '. ' + place.place_name;

                const address = document.createElement('small');
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    '주소 정보 없음';

                const category = document.createElement('small');
                category.textContent =
                    place.category_name || '문화시설';

                listItem.appendChild(title);
                listItem.appendChild(address);
                listItem.appendChild(category);

                // 목록을 누르면 해당 장소의 팝업 표시
                listItem.addEventListener('click', function (event) {
                    if (event.target.closest('a')) {
                        return;
                    }

                    map.panTo(position);
                    showPlaceInfo(place, position);
                });

                // 카카오맵 상세 페이지 링크
                if (place.place_url) {
                    const link = document.createElement('a');

                    link.className = 'place-link';
                    link.href = place.place_url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = '카카오맵에서 자세히 보기';

                    listItem.appendChild(document.createElement('br'));
                    listItem.appendChild(link);
                }

                getElement('resultList').appendChild(listItem);
            });

            // 현재 페이지의 마커를 군집화
            if (currentMarkers.length > 0) {
                clusterer.addMarkers(currentMarkers);
            }
        }

        // 장소 상세 팝업 표시
        function showPlaceInfo(place, position) {
            const address =
                place.road_address_name ||
                place.address_name ||
                '주소 정보 없음';

            const activityTitle =
                currentTab === 'musical'
                    ? '현재 공연 중인 뮤지컬'
                    : '현재 상영 중인 영화';

            const extraInfo =
                currentTab === 'musical'
                    ? '공연 제목과 공연 시간은 별도 공연 정보가 필요합니다.'
                    : '영화 제목과 상영 시간은 별도 영화관 정보가 필요합니다.';

            // 팝업에 표시할 문자열을 안전하게 변환
            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, function (char) {
                    const entities = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };

                    return entities[char];
                });
            }

            // 상세 팝업 내용 생성
            let content =
                '<div style="padding:12px;max-width:260px;' +
                'font-size:13px;line-height:1.6;">' +
                '<strong style="font-size:15px;">' +
                escapeHtml(place.place_name) +
                '</strong><br>' +
                escapeHtml(address) +
                '<hr style="border:0;border-top:1px solid #eee;">' +
                '<strong>' + escapeHtml(activityTitle) + '</strong><br>' +
                escapeHtml(extraInfo) +
                '<br><strong>운영 시간</strong><br>' +
                '시설의 공식 안내에서 확인해 주세요.';

            if (currentTab === 'movie') {
                content +=
                    '<br><strong>층수</strong><br>' +
                    '확인 가능한 층수 정보가 없습니다.';
            }

            content +=
                '<br><a href="' + escapeHtml(place.place_url || '#') +
                '" target="_blank" rel="noopener noreferrer">' +
                '장소 상세 정보 보기</a></div>';

            infoWindow.setContent(content);
            infoWindow.setPosition(position);
            infoWindow.open(map);
        }

        // 검색 결과 페이지 번호 표시
        function renderPagination(pagination) {
            const paginationElement = getElement('pagination');
            paginationElement.innerHTML = '';

            if (!pagination || pagination.last <= 1) {
                return;
            }

            // 이전 페이지 버튼
            addPageButton(
                '이전',
                function () {
                    pagination.prevPage();
                },
                !pagination.hasPrevPage
            );

            // 페이지 번호 버튼
            for (let page = 1; page <= pagination.last; page++) {
                const pageNumber = page;

                addPageButton(
                    String(pageNumber),
                    function () {
                        pagination.gotoPage(pageNumber);
                    },
                    false,
                    pageNumber === pagination.current
                );
            }

            // 다음 페이지 버튼
            addPageButton(
                '다음',
                function () {
                    pagination.nextPage();
                },
                !pagination.hasNextPage
            );
        }

        // 페이지 버튼 생성
        function addPageButton(label, callback, disabled, active) {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'page-button';
            button.textContent = label;
            button.disabled = disabled;

            if (active) {
                button.classList.add('active');
            }

            button.addEventListener('click', callback);

            getElement('pagination').appendChild(button);
        }
    </script>
</body>
</html>
