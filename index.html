<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 행복을 찾아서: 문화시설 지도</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Malgun Gothic', sans-serif; }

    /* 화면 2분할 레이아웃 (왼쪽: 검색 / 오른쪽: 지도) */
    #wrapper { display: flex; height: 100%; }
    #sidebar { width: 340px; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #fff; }
    #map { flex: 1; }

    /* 제목 + 현재 위치 */
    #header { padding: 14px; background: #fff7e0; border-bottom: 1px solid #eee; }
    #header h1 { font-size: 16px; margin-bottom: 6px; }
    #myLocation { font-size: 12px; color: #555; line-height: 1.5; word-break: break-all; }

    /* 탭 버튼 */
    #tabs { display: flex; }
    .tab-btn { flex: 1; padding: 12px 4px; border: none; background: #f2f2f2; cursor: pointer; font-size: 14px; font-weight: bold; }
    .tab-btn.active { background: #ffb300; color: #fff; }
    #categoryBtn { margin: 8px 14px; padding: 8px; border: 1px solid #ffb300; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #categoryBtn:hover { background: #fff3cd; }

    /* 결과 리스트 */
    #resultInfo { padding: 4px 14px; font-size: 12px; color: #888; }
    #placeList { flex: 1; overflow-y: auto; list-style: none; }
    #placeList li { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
    #placeList li:hover { background: #fffaf0; }
    #placeList .name { font-weight: bold; font-size: 14px; }
    #placeList .addr { font-size: 12px; color: #777; margin-top: 2px; }
    #placeList .dist { font-size: 11px; color: #ff8f00; }

    /* 페이지네이션 */
    #pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; padding: 8px; border-top: 1px solid #eee; }
    #pagination button { min-width: 28px; padding: 4px 6px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; }
    #pagination button.on { background: #ffb300; color: #fff; border-color: #ffb300; }

    /* 마커 팝업 */
    .popup { padding: 10px 12px; width: 260px; font-size: 12px; line-height: 1.5; }
    .popup h3 { font-size: 14px; margin-bottom: 4px; }
    .popup .row { margin-top: 3px; }
    .popup .label { display: inline-block; min-width: 62px; color: #ff8f00; font-weight: bold; }
    .popup a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <div id="wrapper">
    <!-- 왼쪽: 검색 영역 -->
    <div id="sidebar">
      <div id="header">
        <h1>🎭 오늘의 행복을 찾아서</h1>
        <div id="myLocation">현재 위치를 확인하는 중...</div>
      </div>
      <div id="tabs">
        <button class="tab-btn" data-tab="musical">🎭 뮤지컬 보러가기</button>
        <button class="tab-btn" data-tab="movie">🎬 영화 보러가기</button>
      </div>
      <button id="categoryBtn">📍 문화시설(CT1) 카테고리로 전체 검색</button>
      <div id="resultInfo">탭을 눌러 주변 장소를 찾아보세요.</div>
      <ul id="placeList"></ul>
      <div id="pagination"></div>
    </div>

    <!-- 오른쪽: 지도 -->
    <div id="map"></div>
  </div>

  <script>
    // ============================================================
    // 1. 설정값
    // ============================================================
    // ⚠️ 아래 따옴표 안에 JavaScript 키만 붙여 넣으세요. (대괄호 [ ] 는 넣지 마세요)
    // ⚠️ 이 파일을 GitHub 등 공개된 곳에 올릴 때는 키를 지우고 올리세요.
    const RAW_KAKAO_KEY = '5e49c63bc49c9eb43bf2f0e8e798f477';

    // 실수로 들어간 대괄호/공백/따옴표를 자동으로 제거
    const KAKAO_JS_KEY = RAW_KAKAO_KEY.replace(/[\[\]\s'"]/g, '');

    const DEFAULT_LEVEL = 5;          // 지도 확대 레벨
    const SEARCH_RADIUS = 5000;       // 검색 반경 (미터)
    const PAGE_SIZE = 10;             // 한 페이지에 보여줄 개수 (10개 초과 시 페이지네이션 생성)
    const CULTURE_CODE = 'CT1';       // 카카오 카테고리: 문화시설

    // 탭별 검색 설정 (CT1 안에서 키워드로 좁혀 검색)
    const TAB_CONFIG = {
      musical: { keyword: '뮤지컬', title: '뮤지컬' },
      movie:   { keyword: '영화관', title: '영화' }
    };

    // 상세 정보 직접 입력용 (카카오 API는 상영작/운영시간/층수를 제공하지 않음)
    // 사용법: '장소 이름'을 키로 정확히 적으면 팝업에 표시됩니다.
    const EXTRA_INFO = {
      // '샤롯데씨어터': { shows: '레미제라블', hours: '화~일 10:00~21:00' },
      // '메가박스 코엑스': { movies: '영화 A, 영화 B', hours: '09:00~24:00', floor: '7층' }
    };

    // ============================================================
    // 2. 전역 변수
    // ============================================================
    let map, ps, geocoder, clusterer, infoWindow;
    let myPosition = null;            // 내 위치 (LatLng)
    let currentTab = null;            // 현재 선택된 탭
    let markers = [];                 // 현재 표시 중인 마커들

    // ============================================================
    // 3. SDK 동적 로딩 (키를 한 곳에서만 관리)
    // ============================================================
    const statusBox = document.getElementById('myLocation');

    if (location.protocol === 'file:') {
      // file:// 로 열면 위치 기능과 카카오 도메인 검사가 모두 실패함
      statusBox.innerHTML = '⚠️ 파일을 직접 열면 지도가 뜨지 않아요.<br>VS Code의 Live Server 등으로 열어주세요.';
    } else if (!KAKAO_JS_KEY || KAKAO_JS_KEY === 'YOUR_KAKAO_JS_KEY') {
      statusBox.textContent = '⚠️ 코드 위쪽 RAW_KAKAO_KEY에 JavaScript 키를 넣어 주세요.';
    } else {
      const sdkScript = document.createElement('script');
      sdkScript.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY +
                      '&libraries=services,clusterer&autoload=false';
      sdkScript.onload = function () {
        // 지도 SDK가 완전히 로드된 후에 실행 (로딩 오류 방지)
        kakao.maps.load(initMap);
      };
      sdkScript.onerror = function () {
        // 현재 접속 주소를 보여줘서 카카오 콘솔에 등록한 도메인과 비교할 수 있게 함
        statusBox.innerHTML =
          '⚠️ 지도 SDK를 불러오지 못했어요.<br>' +
          '현재 접속 주소: <b>' + location.origin + '</b><br>' +
          '이 주소가 카카오 콘솔 [플랫폼 → Web] 도메인에 등록되어 있는지,<br>' +
          '[카카오맵 사용 설정]이 ON인지 확인해 주세요.';
      };
      document.head.appendChild(sdkScript);
    }

    // ============================================================
    // 4. 지도 초기화
    // ============================================================
    function initMap() {
      // 위치를 얻기 전 임시 중심 (서울시청)
      const defaultCenter = new kakao.maps.LatLng(37.5665, 126.9780);

      map = new kakao.maps.Map(document.getElementById('map'), {
        center: defaultCenter,
        level: DEFAULT_LEVEL
      });

      ps = new kakao.maps.services.Places();
      geocoder = new kakao.maps.services.Geocoder();
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10, removable: true });

      // 마커 군집화 설정 (레벨 4 이상에서 가까운 마커를 묶어서 표시)
      clusterer = new kakao.maps.MarkerClusterer({
        map: map,
        averageCenter: true,
        minLevel: 4
      });

      // 탭 / 카테고리 버튼 이벤트
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () { selectTab(btn.dataset.tab); });
      });
      document.getElementById('categoryBtn').addEventListener('click', searchByCategory);

      // 지도 빈 곳을 누르면 팝업 닫기
      kakao.maps.event.addListener(map, 'click', function () { infoWindow.close(); });

      getMyLocation();
    }

    // ============================================================
    // 5. 현재 위치 가져오기
    // ============================================================
    function getMyLocation() {
      if (!navigator.geolocation) {
        useFallbackLocation('이 브라우저는 위치 기능을 지원하지 않아요.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          myPosition = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
          map.setCenter(myPosition);
          map.setLevel(DEFAULT_LEVEL);
          showMyMarker();
          showMyAddress();
        },
        function () {
          useFallbackLocation('위치 권한이 거부되어 서울시청 기준으로 보여드려요.');
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    // 위치를 못 얻었을 때 서울시청으로 대체
    function useFallbackLocation(message) {
      myPosition = new kakao.maps.LatLng(37.5665, 126.9780);
      map.setCenter(myPosition);
      showMyMarker();
      statusBox.textContent = '⚠️ ' + message;
    }

    // 내 위치 마커 (파란 원)
    function showMyMarker() {
      new kakao.maps.CustomOverlay({
        map: map,
        position: myPosition,
        content: '<div style="width:16px;height:16px;background:#1a73e8;border:3px solid #fff;' +
                 'border-radius:50%;box-shadow:0 0 6px rgba(0,0,0,.5);"></div>',
        zIndex: 5
      });
    }

    // 내 위치 주소 표시
    function showMyAddress() {
      geocoder.coord2Address(myPosition.getLng(), myPosition.getLat(), function (result, status) {
        if (status === kakao.maps.services.Status.OK) {
          const addr = result[0].road_address
            ? result[0].road_address.address_name
            : result[0].address.address_name;
          statusBox.innerHTML = '📍 현재 위치: ' + escapeHtml(addr) +
            '<br>위도 ' + myPosition.getLat().toFixed(5) + ' / 경도 ' + myPosition.getLng().toFixed(5);
        } else {
          statusBox.textContent = '📍 현재 위치를 확인했어요.';
        }
      });
    }

    // ============================================================
    // 6. 탭 / 카테고리 검색
    // ============================================================
    function selectTab(tabKey) {
      if (!myPosition) { alert('아직 위치를 확인하는 중이에요. 잠시 후 다시 눌러주세요.'); return; }
      currentTab = tabKey;

      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.tab === tabKey);
      });

      // 키워드 + 문화시설(CT1) 카테고리로 검색
      ps.keywordSearch(TAB_CONFIG[tabKey].keyword, handleResult, {
        location: myPosition,
        radius: SEARCH_RADIUS,
        category_group_code: CULTURE_CODE,
        size: PAGE_SIZE,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    }

    // 카테고리(CT1)만으로 주변 문화시설 전체 검색
    function searchByCategory() {
      if (!myPosition) { alert('아직 위치를 확인하는 중이에요.'); return; }
      currentTab = null;
      document.querySelectorAll('.tab-btn').forEach(function (btn) { btn.classList.remove('active'); });

      ps.categorySearch(CULTURE_CODE, handleResult, {
        location: myPosition,
        radius: SEARCH_RADIUS,
        size: PAGE_SIZE,
        sort: kakao.maps.services.SortBy.DISTANCE
      });
    }

    // 검색 결과 처리 (페이지를 넘길 때도 이 함수가 다시 호출됨)
    function handleResult(data, status, pagination) {
      clearAll(); // 기존 마커/리스트 삭제

      const info = document.getElementById('resultInfo');

      if (status === kakao.maps.services.Status.ZERO_RESULT) {
        info.textContent = '주변에 검색 결과가 없어요.';
        return;
      }
      if (status !== kakao.maps.services.Status.OK) {
        info.textContent = '검색 중 오류가 발생했어요.';
        return;
      }

      info.textContent = '총 ' + pagination.totalCount + '개 중 ' + pagination.current + '페이지';
      renderPlaces(data);
      renderPagination(pagination);
    }

    // ============================================================
    // 7. 마커 + 리스트 표시
    // ============================================================
    function renderPlaces(places) {
      const listEl = document.getElementById('placeList');
      const bounds = new kakao.maps.LatLngBounds();
      bounds.extend(myPosition);

      places.forEach(function (place) {
        const position = new kakao.maps.LatLng(place.y, place.x);
        const marker = new kakao.maps.Marker({ position: position });
        markers.push(marker);
        bounds.extend(position);

        // 마커 클릭 → 상세 팝업
        kakao.maps.event.addListener(marker, 'click', function () { openPopup(marker, place); });

        // 왼쪽 리스트 항목
        const li = document.createElement('li');
        li.innerHTML =
          '<div class="name">' + escapeHtml(place.place_name) + '</div>' +
          '<div class="addr">' + escapeHtml(place.road_address_name || place.address_name) + '</div>' +
          '<div class="dist">' + formatDistance(place.distance) + '</div>';
        li.addEventListener('click', function () {
          map.panTo(position);
          openPopup(marker, place);
        });
        listEl.appendChild(li);
      });

      clusterer.addMarkers(markers); // 군집화 적용
      map.setBounds(bounds);
    }

    // 상세 팝업 열기
    function openPopup(marker, place) {
      const extra = EXTRA_INFO[place.place_name] || {};
      const address = place.road_address_name || place.address_name;

      // 층수: 직접 입력한 값 → 이름/주소에서 "n층" 추출 → 없으면 안내 문구
      const floorMatch = (place.place_name + ' ' + address).match(/(지하\s?\d+층|\d+층)/);
      const floor = extra.floor || (floorMatch ? floorMatch[0] : '카카오맵에서 확인');
      const hours = extra.hours || '카카오맵에서 확인';

      let detail = '';
      if (currentTab === 'movie') {
        // 탭 2: 상영 영화 / 운영시간 / 층
        detail =
          row('상영 중', extra.movies || '카카오맵에서 확인') +
          row('운영시간', hours) +
          row('위치(층)', floor);
      } else {
        // 탭 1(또는 카테고리 검색): 공연 중인 뮤지컬 / 운영시간
        detail =
          row('공연 중', extra.shows || '카카오맵에서 확인') +
          row('운영시간', hours);
      }

      const content =
        '<div class="popup">' +
          '<h3>' + escapeHtml(place.place_name) + '</h3>' +
          row('주소', address) +
          (place.phone ? row('전화', place.phone) : '') +
          detail +
          '<div class="row"><a href="' + escapeHtml(place.place_url) + '" target="_blank" rel="noopener">카카오맵에서 상세 보기 ›</a></div>' +
        '</div>';

      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    function row(label, value) {
      return '<div class="row"><span class="label">' + label + '</span>' + escapeHtml(value) + '</div>';
    }

    // ============================================================
    // 8. 페이지네이션 (결과가 10개를 넘으면 표시)
    // ============================================================
    function renderPagination(pagination) {
      const area = document.getElementById('pagination');
      area.innerHTML = '';
      if (pagination.last <= 1) return;

      for (let i = 1; i <= pagination.last; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === pagination.current) btn.className = 'on';
        btn.addEventListener('click', function () { pagination.gotoPage(i); });
        area.appendChild(btn);
      }
    }

    // ============================================================
    // 9. 기존 결과 지우기
    // ============================================================
    function clearAll() {
      infoWindow.close();
      clusterer.clear();
      markers.forEach(function (m) { m.setMap(null); });
      markers = [];
      document.getElementById('placeList').innerHTML = '';
      document.getElementById('pagination').innerHTML = '';
    }

    // ============================================================
    // 10. 보조 함수
    // ============================================================
    // XSS 방지용 문자 변환
    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 거리 표시 (m → km)
    function formatDistance(meter) {
      if (!meter) return '';
      const m = Number(meter);
      return m >= 1000 ? (m / 1000).toFixed(1) + 'km' : m + 'm';
    }
  </script>
</body>
</html>
