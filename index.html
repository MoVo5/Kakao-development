<body>
    <div class="container">

        <!-- 왼쪽 검색창과 결과 목록 -->
        <aside class="sidebar">

            <h1>오늘의 행복을 찾아서<br>문화시설 지도</h1>

            <p class="description">
                내 주변 문화시설을 찾아<br>
                오늘의 행복을 발견해 보세요!
            </p>

            <!-- 문화시설 검색 탭 -->
            <div class="tabs">
                <button
                    class="tab-button active"
                    id="musicalTab"
                    onclick="changeTab('musical')">
                    뮤지컬 보러가기
                </button>

                <button
                    class="tab-button"
                    id="movieTab"
                    onclick="changeTab('movie')">
                    영화 보러가기
                </button>
            </div>

            <!-- 장소 이름 검색 -->
            <div class="search-box">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="문화시설 이름 검색"
                    aria-label="문화시설 이름 검색">

                <button class="search-button" onclick="searchKeyword()">
                    검색
                </button>
            </div>

            <button class="location-button" onclick="getCurrentLocation()">
                📍 내 현재 위치 확인
            </button>

            <div id="status" role="status" aria-live="polite">
                지도를 불러오는 중입니다.
            </div>

            <ul id="resultList"></ul>

            <div id="pagination" aria-label="검색 결과 페이지"></div>

        </aside>

        <!-- 오른쪽 지도 -->
        <div id="map" aria-label="주변 문화시설 지도"></div>

    </div>

    <!-- 카카오 지도 SDK: 장소 검색과 마커 군집화 라이브러리 포함 -->
    <!-- YOUR_KAKAO_JAVASCRIPT_KEY를 본인의 JavaScript 키로 교체하세요. -->
    <script
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5e49c63bc49c9eb43bf2f0e8e798f477&libraries=services,clusterer&autoload=false">
    </script>

    <script>
        // 지도와 검색에 필요한 변수
        let map;
        let placesService;
        let clusterer;
        let currentLocationMarker;
        let currentPosition;
        let currentTab = 'musical';
        let currentPagination = null;
        let currentMarkers = [];
        let currentPlaces = [];
        let infoWindow;
        let searchMode = 'category';
        let searchRequestNumber = 0;

        // 현재 위치를 확인할 수 없을 때 사용하는 기본 중심 좌표
        const defaultPosition = new kakao.maps.LatLng(
            37.5665,
            126.9780
        );

        // HTML 요소를 쉽게 사용하기 위한 함수
        function getElement(id) {
            return document.getElementById(id);
        }

        // 지도가 완전히 준비된 후 실행
        kakao.maps.load(function () {
            // 지도 생성: 확대 레벨 5
            map = new kakao.maps.Map(getElement('map'), {
                center: defaultPosition,
                level: 5
            });

            // 장소 검색 서비스 생성
            placesService = new kakao.maps.services.Places(map);

            // 마커 클릭 시 표시할 팝업 생성
            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            // 마커 군집화 기능 생성
            clusterer = new kakao.maps.MarkerClusterer({
                map: map,
                averageCenter: true,
                minLevel: 7
            });

            // 지도 생성이 끝난 뒤 현재 위치 확인
            getCurrentLocation();
        });

        // 현재 위치를 확인하고 지도 중심을 이동
        function getCurrentLocation() {
            if (!map) {
                getElement('status').textContent =
                    '지도를 불러오는 중입니다. 잠시 후 다시 시도해 주세요.';
                return;
            }

            if (!navigator.geolocation) {
                getElement('status').textContent =
                    '이 브라우저에서는 위치 확인을 지원하지 않습니다.';
                searchNearby();
                return;
            }

            getElement('status').textContent =
                '현재 위치를 확인하고 있습니다. 위치 권한을 허용해 주세요.';

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 브라우저에서 받은 현재 위치 저장
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    // 지도 중심 이동
                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    // 이전 현재 위치 마커 제거
                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                    }

                    // 현재 위치 마커 표시
                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: '내 현재 위치'
                    });

                    getElement('status').textContent =
                        '현재 위치: 위도 ' +
                        position.coords.latitude.toFixed(5) +
                        ', 경도 ' +
                        position.coords.longitude.toFixed(5);

                    // 위치 확인 후 선택된 탭의 장소 검색
                    searchNearby();
                },
                function (error) {
                    // 위치 권한 거부 또는 위치 확인 실패 처리
                    map.setCenter(defaultPosition);

                    getElement('status').textContent =
                        '현재 위치를 확인할 수 없어 기본 위치에서 검색합니다. ' +
                        '브라우저의 위치 권한과 HTTPS 연결을 확인해 주세요.';

                    searchNearby();
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        // 탭 변경
        function changeTab(tab) {
            currentTab = tab;

            getElement('musicalTab').classList.toggle(
                'active',
                tab === 'musical'
            );

            getElement('movieTab').classList.toggle(
                'active',
                tab === 'movie'
            );

            // 이전 검색 결과와 마커 제거
            clearResults();

            // 탭 변경 시 카테고리 검색으로 전환
            searchMode = 'category';
            getElement('searchInput').value = '';

            // 선택된 탭에 맞춰 문화시설 검색
            searchNearby();
        }

        // 기존 검색 결과, 팝업, 마커, 페이지 번호 초기화
        function clearResults() {
            searchRequestNumber++;

            if (clusterer) {
                clusterer.clear();
            }

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            currentPlaces = [];
            currentPagination = null;

            if (infoWindow) {
                infoWindow.close();
            }

            getElement('resultList').innerHTML = '';
            getElement('pagination').innerHTML = '';
        }

        // 내 주변 문화시설 검색
        function searchNearby() {
            if (!placesService || !map) {
                return;
            }

            clearResults();
            searchMode = 'category';

            getElement('status').textContent =
                '주변 문화시설을 검색하고 있습니다.';

            const requestNumber = searchRequestNumber;

            // CT1은 뮤지컬이나 영화만이 아닌 문화시설 전체 카테고리
            const options = {
                location: currentPosition || map.getCenter(),
                radius: 10000,
                sort: kakao.maps.services.SortBy.DISTANCE
            };

            // 카테고리 검색 실행
            placesService.categorySearch(
                'CT1',
                function (data, status, pagination) {
                    // 이전 검색의 늦은 응답은 무시
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    handleSearchResults(data, status, pagination);
                },
                options
            );
        }

        // 검색창에 입력한 장소 이름 검색
        function searchKeyword() {
            if (!placesService || !map) {
                return;
            }

            const keyword = getElement('searchInput').value.trim();

            if (!keyword) {
                searchNearby();
                return;
            }

            clearResults();
            searchMode = 'keyword';

            getElement('status').textContent =
                '입력한 장소를 검색하고 있습니다.';

            const requestNumber = searchRequestNumber;

            // 입력한 단어로 장소 검색
            placesService.keywordSearch(
                keyword,
                function (data, status, pagination) {
                    // 이전 검색의 늦은 응답은 무시
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    handleSearchResults(data, status, pagination);
                },
                {
                    location: currentPosition || map.getCenter(),
                    sort: kakao.maps.services.SortBy.DISTANCE
                }
            );
        }

        // 엔터 키를 눌러도 검색할 수 있도록 설정
        getElement('searchInput').addEventListener(
            'keydown',
            function (event) {
                if (event.key === 'Enter') {
                    searchKeyword();
                }
            }
        );

        // 검색 결과 처리
        function handleSearchResults(data, status, pagination) {
            if (status === kakao.maps.services.Status.ZERO_RESULT) {
                clearResults();
                getElement('status').textContent =
                    '주변에서 검색 결과를 찾지 못했습니다.';
                return;
            }

            if (status !== kakao.maps.services.Status.OK) {
                getElement('status').textContent =
                    '검색에 실패했습니다. 잠시 후 다시 시도해 주세요.';
                return;
            }

            currentPagination = pagination;
            currentPlaces = data;

            // 현재 페이지의 결과만 새로 표시
            renderPlaces(data);

            // 페이지 번호 표시
            renderPagination(pagination);

            getElement('status').textContent =
                '현재 페이지 검색 결과: ' + data.length + '곳';

            // 첫 번째 검색 결과를 지도에 표시할 수 있도록 범위 조정
            if (data.length > 0) {
                const bounds = new kakao.maps.LatLngBounds();

                data.forEach(function (place) {
                    bounds.extend(
                        new kakao.maps.LatLng(place.y, place.x)
                    );
                });

                // 현재 위치도 지도 범위에 포함
                if (currentPosition) {
                    bounds.extend(currentPosition);
                }

                map.setBounds(bounds);
            }
        }

        // 장소 목록과 지도 마커 생성
        function renderPlaces(places) {
            // 이전 페이지 마커와 목록을 제거
            if (clusterer) {
                clusterer.clear();
            }

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            getElement('resultList').innerHTML = '';

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                // 군집화 대상 마커 생성
                const marker = new kakao.maps.Marker({
                    position: position,
                    title: place.place_name
                });

                currentMarkers.push(marker);

                // 장소 상세 팝업 연결
                kakao.maps.event.addListener(
                    marker,
                    'click',
                    function () {
                        showPlaceInfo(place, position);
                    }
                );

                // 왼쪽 결과 목록 생성
                const listItem = document.createElement('li');
                listItem.className = 'place-item';

                const title = document.createElement('strong');
                title.textContent =
                    (index + 1) + '. ' + place.place_name;

                const address = document.createElement('small');
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    '주소 정보 없음';

                const category = document.createElement('small');
                category.textContent =
                    place.category_name || '문화시설';

                listItem.appendChild(title);
                listItem.appendChild(address);
                listItem.appendChild(category);

                // 장소 이름을 누르면 지도 중심 이동 및 팝업 표시
                listItem.addEventListener('click', function () {
                    map.panTo(position);
                    showPlaceInfo(place, position);
                });

                // 카카오맵 장소 상세 페이지 연결
                if (place.place_url) {
                    const link = document.createElement('a');
                    link.className = 'place-link';
                    link.href = place.place_url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = '카카오맵에서 자세히 보기';

                    listItem.appendChild(document.createElement('br'));
                    listItem.appendChild(link);
                }

                getElement('resultList').appendChild(listItem);
            });

            // 현재 페이지의 마커를 군집화
            if (clusterer && currentMarkers.length > 0) {
                clusterer.addMarkers(currentMarkers);
            }
        }

        // 장소 상세 팝업 표시
        function showPlaceInfo(place, position) {
            const address =
                place.road_address_name ||
                place.address_name ||
                '주소 정보 없음';

            // 카카오맵 검색 결과에는 실시간 공연·상영 정보가 포함되지 않을 수 있음
            const activityTitle =
                currentTab === 'musical'
                    ? '현재 공연 중인 뮤지컬'
                    : '현재 상영 중인 영화';

            const extraInfo =
                currentTab === 'musical'
                    ? '공연 제목 및 공연 시간은 별도 공연 정보가 필요합니다.'
                    : '영화 제목, 상영 시간 및 층수는 별도 영화관 정보가 필요합니다.';

            // HTML에 삽입할 문자열을 안전하게 변환
            function escapeHtml(value) {
                return String(value).replace(/[&<>"']/g, function (char) {
                    const entities = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };

                    return entities[char];
                });
            }

            const content =
                '<div style="padding:12px;max-width:260px;' +
                'font-size:13px;line-height:1.6;">' +
                '<strong style="font-size:15px;">' +
                escapeHtml(place.place_name) +
                '</strong><br>' +
                '<span>' + escapeHtml(address) + '</span><br>' +
                '<hr style="border:0;border-top:1px solid #eee;">' +
                '<strong>' + escapeHtml(activityTitle) + '</strong><br>' +
                escapeHtml(extraInfo) + '<br>' +
                '<strong>운영 시간</strong><br>' +
                '카카오맵의 별도 시설 정보에서 확인해 주세요.' +
                (currentTab === 'movie'
                    ? '<br><strong>층수</strong><br>' +
                      '확인 가능한 층수 정보가 없습니다.'
                    : '') +
                (place.place_url
                    ? '<br><a href="' + escapeHtml(place.place_url) +
                      '" target="_blank" rel="noopener noreferrer">' +
                      '장소 상세 정보 보기</a>'
                    : '') +
                '</div>';

            infoWindow.setContent(content);
            infoWindow.setPosition(position);
            infoWindow.open(map);
        }

        // 페이지 번호 버튼 생성
        function renderPagination(pagination) {
            const paginationElement = getElement('pagination');
            paginationElement.innerHTML = '';

            if (!pagination || pagination.last <= 1) {
                return;
            }

            // 이전 페이지 버튼
            addPageButton(
                '이전',
                function () {
                    pagination.prevPage();
                },
                !pagination.hasPrevPage
            );

            // 검색 결과 페이지 번호 표시
            for (let page = 1; page <= pagination.last; page++) {
                const pageNumber = page;

                addPageButton(
                    String(pageNumber),
                    function () {
                        pagination.gotoPage(pageNumber);
                    },
                    false,
                    pageNumber === pagination.current
                );
            }

            // 다음 페이지 버튼
            addPageButton(
                '다음',
                function () {
                    pagination.nextPage();
                },
                !pagination.hasNextPage
            );
        }

        // 페이지 번호 버튼을 만드는 함수
        function addPageButton(label, callback, disabled, active) {
            const button = document.createElement('button');

            button.className = 'page-button';
            button.textContent = label;
            button.disabled = disabled;

            if (active) {
                button.classList.add('active');
            }

            button.addEventListener('click', callback);

            getElement('pagination').appendChild(button);
        }
    </script>
</body>
</html>
