<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 행복을 찾아서! 문화시설지도</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #333;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .sidebar {
            width: 380px;
            min-width: 320px;
            padding: 20px;
            overflow-y: auto;
            background: #fffaf4;
        }

        h1 {
            margin-top: 0;
            font-size: 23px;
            line-height: 1.5;
            color: #805b45;
        }

        .description {
            font-size: 13px;
            color: #777;
            line-height: 1.6;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 20px 0;
        }

        .tab-button {
            flex: 1;
            padding: 12px 5px;
            border: none;
            border-radius: 10px;
            background: #eadfd4;
            color: #59483b;
            cursor: pointer;
            font-size: 14px;
        }

        .tab-button.active {
            background: #9b7658;
            color: white;
        }

        .movie-subtabs {
            display: flex;
            gap: 6px;
            margin: -8px 0 16px;
        }

        .movie-subtabs[hidden] {
            display: none;
        }

        .movie-subtab {
            flex: 1;
            padding: 9px 3px;
            border: 1px solid #d7e8d1;
            border-radius: 8px;
            background: #f4f9f1;
            color: #456b3c;
            cursor: pointer;
            font-size: 12px;
        }

        .movie-subtab.active {
            background: #b9e6a8;
            border-color: #9bd487;
            color: #254b1b;
            font-weight: bold;
        }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        #searchInput {
            flex: 1;
            width: 0;
            min-width: 0;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .search-button,
        .location-button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #9b7658;
            color: white;
            cursor: pointer;
            white-space: nowrap;
        }

        .location-button {
            width: 100%;
            margin-bottom: 15px;
            background: #d7a982;
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid #805b45;
            outline-offset: 2px;
        }

        #status {
            margin: 12px 0;
            font-size: 13px;
            color: #725b49;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        #resultList {
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .place-item {
            padding: 14px 10px;
            margin-bottom: 8px;
            border: 1px solid #eee2d6;
            border-radius: 10px;
            background: white;
            cursor: pointer;
        }

        .place-item:hover {
            background: #f6eee6;
        }

        .place-item strong {
            display: block;
            margin-bottom: 6px;
        }

        .place-item small {
            display: block;
            color: #777;
            line-height: 1.5;
        }

        .place-link {
            display: inline-block;
            margin-top: 7px;
            color: #865d3e;
            font-size: 12px;
        }

        #pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin: 18px 0;
        }

        .page-button {
            min-width: 30px;
            padding: 7px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: white;
            cursor: pointer;
        }

        .page-button.active {
            background: #9b7658;
            color: white;
        }

        .page-button:disabled {
            cursor: default;
            opacity: 0.5;
        }

        #map {
            flex: 1;
            min-width: 0;
            height: 100%;
            background: #eee;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
            }

            .sidebar {
                width: 100%;
                min-width: 0;
                height: 48%;
                padding: 14px;
            }

            #map {
                flex: 1;
                min-height: 220px;
            }

            h1 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <aside class="sidebar">
            <h1>오늘의 행복을 찾아서!<br>문화시설지도</h1>

            <p class="description">
                내 주변 문화시설을 찾아<br>
                오늘의 행복을 발견해 보세요!
            </p>

            <div class="tabs">
                <button
                    class="tab-button active"
                    id="musicalTab"
                    type="button">
                    뮤지컬 보러가기🎫
                </button>

                <button
                    class="tab-button"
                    id="movieTab"
                    type="button">
                    영화 보러가기🍿
                </button>
            </div>

            <!-- 영화관 브랜드별 탭 -->
            <div class="movie-subtabs" id="movieSubtabs" hidden>
                <button
                    class="movie-subtab active"
                    id="cgvTab"
                    type="button">
                    CGV
                </button>

                <button
                    class="movie-subtab"
                    id="megaboxTab"
                    type="button">
                    메가박스
                </button>

                <button
                    class="movie-subtab"
                    id="lotteTab"
                    type="button">
                    롯데시네마
                </button>
            </div>

            <!-- 지역을 입력하면 해당 지역 검색 -->
            <!-- 비워 두면 현재 위치 주변 검색 -->
            <div class="search-box">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="지역 입력 (예: 부산, 제주)"
                    aria-label="검색할 지역">

                <button
                    class="search-button"
                    id="searchButton"
                    type="button">
                    검색
                </button>
            </div>

            <button
                class="location-button"
                id="locationButton"
                type="button">
                📍 내 현재 위치 확인
            </button>

            <div id="status" role="status" aria-live="polite">
                카카오 지도를 불러오는 중입니다.
            </div>

            <ul id="resultList"></ul>
            <div id="pagination" aria-label="검색 결과 페이지"></div>
        </aside>

        <div id="map" aria-label="문화시설 지도"></div>
    </div>

    <!-- 카카오 지도 SDK -->
    <!-- 기존 JavaScript 키를 유지했어. -->
    <script
        id="kakaoSdk"
        src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=5e49c63bc49c9eb43bf2f0e8e798f477&libraries=services,clusterer&autoload=false">
    </script>

    <script>
        let map = null;
        let placesService = null;
        let clusterer = null;
        let currentLocationMarker = null;
        let currentPosition = null;
        let currentTab = 'musical';
        let currentMovieBrand = 'cgv';
        let currentMarkers = [];
        let infoWindow = null;
        let searchRequestNumber = 0;

        // 대한민국 중심 부근을 기본 지도 위치로 사용
        // 위치 권한이 거부되어도 서울로 자동 이동하지 않음
        const defaultLatitude = 36.5;
        const defaultLongitude = 127.8;

        // 카카오 장소 검색의 반경 제한
        const searchRadius = 20000;

        // 영화관 브랜드별 검색 설정
        const movieBrands = {
            cgv: {
                label: 'CGV',
                query: 'CGV 영화관',
                pattern: /cgv|씨지브이/i
            },

            megabox: {
                label: '메가박스',
                query: '메가박스 영화관',
                pattern: /메가박스/i
            },

            lotte: {
                label: '롯데시네마',
                query: '롯데시네마 영화관',
                pattern: /롯데시네마/i
            }
        };

        function getElement(id) {
            return document.getElementById(id);
        }

        function setStatus(message) {
            getElement('status').textContent = message;
        }

        // 버튼에 기능 연결
        document.addEventListener('DOMContentLoaded', function () {
            getElement('musicalTab').addEventListener('click', function () {
                changeTab('musical');
            });

            getElement('movieTab').addEventListener('click', function () {
                changeTab('movie');
            });

            getElement('cgvTab').addEventListener('click', function () {
                changeMovieBrand('cgv');
            });

            getElement('megaboxTab').addEventListener('click', function () {
                changeMovieBrand('megabox');
            });

            getElement('lotteTab').addEventListener('click', function () {
                changeMovieBrand('lotte');
            });

            getElement('searchButton').addEventListener('click', searchNearby);

            getElement('locationButton').addEventListener(
                'click',
                getCurrentLocation
            );

            getElement('searchInput').addEventListener(
                'keydown',
                function (event) {
                    if (event.key === 'Enter') {
                        searchNearby();
                    }
                }
            );
        });

        const sdkScript = getElement('kakaoSdk');

        sdkScript.addEventListener('error', function () {
            setStatus(
                '카카오 지도 SDK를 불러오지 못했습니다. ' +
                'JavaScript 키와 사이트 도메인을 확인해 주세요.'
            );
        });

        // 지도 초기화
        function initializeMap() {
            const initialPosition = new kakao.maps.LatLng(
                defaultLatitude,
                defaultLongitude
            );

            map = new kakao.maps.Map(
                getElement('map'),
                {
                    center: initialPosition,
                    level: 13
                }
            );

            placesService = new kakao.maps.services.Places(map);

            infoWindow = new kakao.maps.InfoWindow({
                zIndex: 10
            });

            // 마커 군집화
            clusterer = new kakao.maps.MarkerClusterer({
                map: map,
                averageCenter: true,
                minLevel: 7
            });

            // 지도를 만든 후 실제 현재 위치 확인
            getCurrentLocation();
        }

        function loadKakaoMap() {
            if (!window.kakao || !window.kakao.maps) {
                setStatus(
                    '카카오 지도 SDK가 준비되지 않았습니다. ' +
                    'JavaScript 키와 인터넷 연결을 확인해 주세요.'
                );
                return;
            }

            kakao.maps.load(function () {
                try {
                    initializeMap();
                } catch (error) {
                    console.error('지도 초기화 오류:', error);

                    setStatus(
                        '지도 초기화에 실패했습니다. ' +
                        'F12의 Console에서 오류를 확인해 주세요.'
                    );
                }
            });
        }

        if (window.kakao && window.kakao.maps) {
            loadKakaoMap();
        } else {
            sdkScript.addEventListener('load', loadKakaoMap, {
                once: true
            });
        }

        // 실제 사용자의 위치 확인
        function getCurrentLocation() {
            if (!map) {
                setStatus('지도를 준비하고 있습니다. 잠시 기다려 주세요.');
                return;
            }

            if (!navigator.geolocation) {
                currentPosition = null;

                setStatus(
                    '이 브라우저는 현재 위치 기능을 지원하지 않습니다. ' +
                    '지역을 입력해 검색해 주세요.'
                );
                return;
            }

            setStatus(
                '현재 위치를 확인하고 있습니다. ' +
                '브라우저의 위치 권한 요청이 나오면 허용해 주세요.'
            );

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    // 실제 사용자의 위도와 경도
                    currentPosition = new kakao.maps.LatLng(
                        position.coords.latitude,
                        position.coords.longitude
                    );

                    map.setCenter(currentPosition);
                    map.setLevel(5);

                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                    }

                    currentLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: currentPosition,
                        title: '내 현재 위치'
                    });

                    setStatus(
                        '현재 위치를 확인했습니다. ' +
                        '해당 위치 주변의 문화시설을 검색합니다.'
                    );

                    searchNearby();
                },

                function (error) {
                    currentPosition = null;

                    if (currentLocationMarker) {
                        currentLocationMarker.setMap(null);
                        currentLocationMarker = null;
                    }

                    let reason = '현재 위치를 확인하지 못했습니다.';

                    if (error.code === 1) {
                        reason = '위치 권한이 거부되었습니다.';
                    }

                    if (error.code === 2) {
                        reason = '기기의 위치 정보를 확인할 수 없습니다.';
                    }

                    if (error.code === 3) {
                        reason = '현재 위치 확인 시간이 초과되었습니다.';
                    }

                    setStatus(
                        reason +
                        ' 브라우저 주소창의 사이트 권한에서 위치를 허용하거나, ' +
                        '지역 입력란에 부산, 제주, 대전 등의 지역을 입력해 주세요. ' +
                        '서울로 자동 전환하지 않습니다.'
                    );
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 60000
                }
            );
        }

        // 메인 탭 변경
        function changeTab(tab) {
            currentTab = tab;

            getElement('musicalTab').classList.toggle(
                'active',
                tab === 'musical'
            );

            getElement('movieTab').classList.toggle(
                'active',
                tab === 'movie'
            );

            getElement('movieSubtabs').hidden = tab !== 'movie';

            clearResults();
            searchNearby();
        }

        // 영화관 브랜드 탭 변경
        function changeMovieBrand(brand) {
            currentMovieBrand = brand;

            getElement('cgvTab').classList.toggle(
                'active',
                brand === 'cgv'
            );

            getElement('megaboxTab').classList.toggle(
                'active',
                brand === 'megabox'
            );

            getElement('lotteTab').classList.toggle(
                'active',
                brand === 'lotte'
            );

            clearResults();
            searchNearby();
        }

        // 기존 검색 결과 제거
        function clearResults() {
            searchRequestNumber++;

            if (clusterer) {
                clusterer.clear();
            }

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];

            if (infoWindow) {
                infoWindow.close();
            }

            getElement('resultList').innerHTML = '';
            getElement('pagination').innerHTML = '';
        }

        // 문화시설 검색
        function searchNearby() {
            if (!map || !placesService) {
                return;
            }

            clearResults();

            const requestNumber = searchRequestNumber;
            const region = getElement('searchInput').value.trim();

            let query;
            const options = {
                size: 15
            };

            if (currentTab === 'movie') {
                // 선택한 영화관 브랜드만 검색
                query = movieBrands[currentMovieBrand].query;

                if (region) {
                    query = region + ' ' + query;
                }
            } else {
                // 공연장 검색
                query = region
                    ? region + ' 공연장'
                    : '공연장';
            }

            if (!region) {
                // 지역 입력이 없으면 실제 현재 위치를 사용
                if (!currentPosition) {
                    setStatus(
                        '현재 위치를 확인하지 못했습니다. ' +
                        '위치 권한을 허용하거나 지역을 입력해 주세요.'
                    );
                    return;
                }

                options.location = currentPosition;
                options.radius = searchRadius;
                options.sort = kakao.maps.services.SortBy.DISTANCE;
            } else {
                // 지역을 입력하면 해당 지역 키워드로 검색
                options.sort = kakao.maps.services.SortBy.ACCURACY;
            }

            setStatus(
                region
                    ? '입력한 지역의 문화시설을 검색하고 있습니다.'
                    : '현재 위치 주변의 문화시설을 검색하고 있습니다.'
            );

            placesService.keywordSearch(
                query,

                function (data, status, pagination) {
                    // 이전 요청의 결과가 늦게 도착하면 무시
                    if (requestNumber !== searchRequestNumber) {
                        return;
                    }

                    if (
                        status === kakao.maps.services.Status.ZERO_RESULT ||
                        !data ||
                        data.length === 0
                    ) {
                        clearResults();

                        setStatus(
                            '검색 결과가 없습니다. ' +
                            '지역 이름을 바꾸거나 다른 탭을 선택해 주세요.'
                        );
                        return;
                    }

                    if (status !== kakao.maps.services.Status.OK) {
                        setStatus(
                            '검색에 실패했습니다. 잠시 후 다시 시도해 주세요.'
                        );
                        return;
                    }

                    let filtered = data;

                    if (currentTab === 'movie') {
                        const brand = movieBrands[currentMovieBrand];

                        filtered = data.filter(function (place) {
                            const name = place.place_name || '';
                            const category = place.category_name || '';

                            // 브랜드 이름과 실제 영화관 분류가 모두 맞아야 함
                            // 예: 투썸플레이스 명동CGV스윗바점은 영화관이 아니므로 제외
                            return (
                                brand.pattern.test(name) &&
                                /영화관/.test(category) &&
                                !/투썸|스타벅스|카페|커피|베이커리/i.test(name)
                            );
                        });
                    } else {
                        filtered = data.filter(function (place) {
                            const category = place.category_name || '';

                            return /공연장|연극극장/.test(category);
                        });
                    }

                    if (filtered.length === 0) {
                        clearResults();

                        setStatus(
                            '조건에 맞는 장소가 없습니다. ' +
                            '지역을 바꾸거나 다른 영화관 브랜드 탭을 선택해 주세요.'
                        );
                        return;
                    }

                    renderPlaces(filtered);
                    renderPagination(pagination);

                    setStatus(
                        '조건에 맞는 검색 결과 ' +
                        filtered.length +
                        '곳을 표시했습니다.'
                    );
                },

                options
            );
        }

        // 연두색 마커 만들기
        function createLightGreenMarker(position, title) {
            const svg =
                '<svg xmlns="http://www.w3.org/2000/svg" ' +
                'width="34" height="44" viewBox="0 0 34 44">' +
                '<path d="M17 1C8.2 1 1.5 7.8 1.5 16.3 ' +
                'C1.5 27.2 17 43 17 43S32.5 27.2 32.5 16.3 ' +
                'C32.5 7.8 25.8 1 17 1Z" ' +
                'fill="#b9e6a8" stroke="#5f9f4f" stroke-width="2"/>' +
                '<circle cx="17" cy="16" r="5.5" fill="#ffffff" ' +
                'stroke="#5f9f4f" stroke-width="1.5"/>' +
                '</svg>';

            const image = new kakao.maps.MarkerImage(
                'data:image/svg+xml;charset=UTF-8,' +
                encodeURIComponent(svg),
                new kakao.maps.Size(34, 44),
                {
                    offset: new kakao.maps.Point(17, 43)
                }
            );

            return new kakao.maps.Marker({
                position: position,
                title: title,
                image: image
            });
        }

        // 장소 목록과 지도 마커 표시
        function renderPlaces(places) {
            if (clusterer) {
                clusterer.clear();
            }

            currentMarkers.forEach(function (marker) {
                marker.setMap(null);
            });

            currentMarkers = [];
            getElement('resultList').innerHTML = '';

            places.forEach(function (place, index) {
                const position = new kakao.maps.LatLng(
                    place.y,
                    place.x
                );

                const marker = createLightGreenMarker(
                    position,
                    place.place_name
                );

                currentMarkers.push(marker);

                kakao.maps.event.addListener(
                    marker,
                    'click',
                    function () {
                        showPlaceInfo(place, position);
                    }
                );

                const item = document.createElement('li');
                item.className = 'place-item';

                const title = document.createElement('strong');
                title.textContent =
                    (index + 1) + '. ' + place.place_name;

                const address = document.createElement('small');
                address.textContent =
                    place.road_address_name ||
                    place.address_name ||
                    '주소 정보 없음';

                const category = document.createElement('small');
                category.textContent =
                    place.category_name || '문화시설';

                item.appendChild(title);
                item.appendChild(address);
                item.appendChild(category);

                item.addEventListener('click', function (event) {
                    if (event.target.closest('a')) {
                        return;
                    }

                    map.panTo(position);
                    showPlaceInfo(place, position);
                });

                if (place.place_url) {
                    const link = document.createElement('a');

                    link.className = 'place-link';
                    link.href = place.place_url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.textContent = '카카오맵에서 자세히 보기';

                    item.appendChild(document.createElement('br'));
                    item.appendChild(link);
                }

                getElement('resultList').appendChild(item);
            });

            // 마커 군집화 적용
            if (clusterer && currentMarkers.length > 0) {
                clusterer.addMarkers(currentMarkers);
            }
        }

        // 장소 정보 팝업
        // 실제로 확인할 수 없는 상영 시간이나 공연 정보를 만들지 않음
        function showPlaceInfo(place, position) {
            const address =
                place.road_address_name ||
                place.address_name ||
                '주소 정보 없음';

            const safeName = escapeHtml(
                place.place_name || '장소 이름 없음'
            );

            const safeAddress = escapeHtml(address);
            const safeUrl = escapeHtml(place.place_url || '#');

            const content =
                '<div style="padding:12px;max-width:260px;' +
                'font-size:13px;line-height:1.6;">' +
                '<strong style="font-size:15px;">' +
                safeName +
                '</strong><br>' +
                safeAddress +
                '<br><a href="' +
                safeUrl +
                '" target="_blank" rel="noopener noreferrer">' +
                '카카오맵에서 자세히 보기</a></div>';

            infoWindow.setContent(content);
            infoWindow.setPosition(position);
            infoWindow.open(map);
        }

        // 팝업에 넣을 HTML 문자열 안전 처리
        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, function (char) {
                const entities = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };

                return entities[char];
            });
        }

        // 검색 결과 페이지 번호 표시
        function renderPagination(pagination) {
            const element = getElement('pagination');
            element.innerHTML = '';

            if (!pagination || pagination.last <= 1) {
                return;
            }

            addPageButton(
                '이전',
                function () {
                    pagination.prevPage();
                },
                !pagination.hasPrevPage
            );

            for (let page = 1; page <= pagination.last; page++) {
                const pageNumber = page;

                addPageButton(
                    String(pageNumber),
                    function () {
                        pagination.gotoPage(pageNumber);
                    },
                    false,
                    pageNumber === pagination.current
                );
            }

            addPageButton(
                '다음',
                function () {
                    pagination.nextPage();
                },
                !pagination.hasNextPage
            );
        }

        // 페이지 버튼 생성
        function addPageButton(label, callback, disabled, active) {
            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'page-button';
            button.textContent = label;
            button.disabled = disabled;

            if (active) {
                button.classList.add('active');
            }

            button.addEventListener('click', callback);

            getElement('pagination').appendChild(button);
        }
    </script>
</body>
</html>
